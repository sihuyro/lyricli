[package]
name = "lyricli"
version = "0.1.0"
edition = "2024"
description = "Real-time synced Spotify and MPRIS lyrics in the terminal with ASCII typography and album cover art"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sihuyro/lyricli"
keywords = ["spotify", "lyrics", "ascii", "terminal", "mpris"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "lyricli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
